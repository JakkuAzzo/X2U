name: X2U
options:
  bundleIdPrefix: com.x2u
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  X2U:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - X2U/Sources
    resources:
      - X2U/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x2u.x2u
        PRODUCT_NAME: X2U
        INFOPLIST_KEY_CFBundleDisplayName: X2U
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_STYLE: Automatic
  X2UTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - X2U/Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: X2U
schemes:
  X2U:
    build:
      targets:
        X2U: all
    test:
      targets:
        - X2UTests
